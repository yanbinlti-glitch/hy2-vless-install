name: shellcheck

on:
  push:
  pull_request:

jobs:
  bash-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n install.sh
          find lib -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -S warning -e SC2034,SC2046,SC2154,SC2155 install.sh
          shellcheck -S warning -e SC2034,SC2046,SC2154,SC2155 lib/*.sh
